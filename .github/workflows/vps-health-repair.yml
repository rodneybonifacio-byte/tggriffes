name: VPS health repair

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: vps-health-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check public site first
        id: public_check
        shell: bash
        run: |
          set +e
          curl -fsS --connect-timeout 5 --max-time 12 https://atacado.tggriffes.com.br >/dev/null
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Repair VPS via SSH
        if: github.event_name == 'workflow_dispatch' || steps.public_check.outputs.status != '0'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -Eeuo pipefail
            APP_DIR="/opt/apps"
            SERVICE="tggriffes"

            echo "== firewall =="
            if command -v ufw >/dev/null 2>&1; then
              sudo ufw allow 80/tcp || true
              sudo ufw allow 443/tcp || true
              sudo ufw allow 22/tcp || true
            fi

            echo "== docker =="
            sudo systemctl enable --now docker || true
            cd "$APP_DIR"
            docker compose up -d "$SERVICE" || docker compose up -d
            docker compose ps

            echo "== nginx =="
            if command -v nginx >/dev/null 2>&1; then
              sudo nginx -t
              sudo systemctl enable --now nginx || true
              sudo systemctl reload nginx || sudo systemctl restart nginx
            fi

            echo "== local ports =="
            ss -ltnp | grep -E ':(80|443)\b' || true
            timeout 10 curl -fsSI http://127.0.0.1 >/dev/null || docker compose restart "$SERVICE" || true

      - name: Verify after repair
        if: always()
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --connect-timeout 5 --max-time 12 https://atacado.tggriffes.com.br >/dev/null; then
              echo "Site is online"
              if curl -fsSL --max-time 20 "https://atacado.tggriffes.com.br/?health=${GITHUB_RUN_ID}" | grep -q "GTM-57PD35M9"; then
                echo "GTM-57PD35M9 confirmed in production"
                exit 0
              fi
              echo "Site online but serving HTML without GTM-57PD35M9 (stale build?)"
              exit 1
            fi
            sleep 10
          done
          echo "Site still unreachable from GitHub runner"
          exit 1