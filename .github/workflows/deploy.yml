name: Deploy fashion-retail-clone
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tggriffes-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/apps/tggriffes-clone && git pull origin main
            cd /opt/apps
            docker compose build --no-cache \
              --build-arg VITE_SUPABASE_URL=https://dvqeitcliexenhnfradm.supabase.co \
              --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2cWVpdGNsaWV4ZW5obmZyYWRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2MjY3ODksImV4cCI6MjA4MzIwMjc4OX0.UJrQF1SALl0qYRZqY7H-PGI_83DEJ6hFzY8OaJPpwl4 \
              --build-arg VITE_SUPABASE_PROJECT_ID=dvqeitcliexenhnfradm \
              tggriffes
            docker compose up -d --no-deps tggriffes
            docker compose ps tggriffes

            # Self-heal the VPS web entrypoints after deploy. This prevents a
            # good build from staying offline because nginx/firewall/docker was left stopped.
            if command -v ufw >/dev/null 2>&1; then
              sudo ufw allow 80/tcp || true
              sudo ufw allow 443/tcp || true
            fi

            if command -v nginx >/dev/null 2>&1; then
              sudo nginx -t
              sudo systemctl enable --now nginx || true
              sudo systemctl reload nginx || sudo systemctl restart nginx
            fi

            timeout 15 curl -fsSI http://127.0.0.1 >/dev/null || docker compose restart tggriffes
            docker image prune -f

      - name: Verify production contains Google Tag Manager
        run: |
          set -e
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 "https://atacado.tggriffes.com.br/?deploy=${GITHUB_SHA}" | grep -q "GTM-57PD35M9"; then
              echo "GTM-57PD35M9 confirmed in production"
              exit 0
            fi
            echo "Waiting for the new production container (${attempt}/12)..."
            sleep 10
          done
          echo "Deployment finished, but production is still serving HTML without GTM-57PD35M9"
          exit 1
