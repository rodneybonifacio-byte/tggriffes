name: Deploy fashion-retail-clone
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/apps/tggriffes-clone && git pull origin main
            cd /opt/apps
            docker compose build --no-cache \
              --build-arg VITE_SUPABASE_URL=https://dvqeitcliexenhnfradm.supabase.co \
              --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2cWVpdGNsaWV4ZW5obmZyYWRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2MjY3ODksImV4cCI6MjA4MzIwMjc4OX0.UJrQF1SALl0qYRZqY7H-PGI_83DEJ6hFzY8OaJPpwl4 \
              --build-arg VITE_SUPABASE_PROJECT_ID=dvqeitcliexenhnfradm \
              tggriffes
            docker compose up -d --no-deps tggriffes
            docker image prune -f
