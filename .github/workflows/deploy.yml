name: Deploy fashion-retail-clone
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/apps/tggriffes-clone && git pull origin main
            cd /opt/apps
            docker compose build --no-cache \
              --build-arg VITE_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }} \
              --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }} \
              --build-arg VITE_SUPABASE_PROJECT_ID=self-hosted \
              tggriffes
            docker compose up -d --no-deps tggriffes
            docker image prune -f
